<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="medGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <!-- Circular 360 arrow track -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#334155" stroke-width="14" stroke-dasharray="16 12" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#medGrad)" stroke-width="16" stroke-dasharray="450 600" stroke-linecap="round" />
  <!-- Medical Cross / Capsule Combination -->
  <g transform="translate(256, 256)">
    <!-- Pill Capsule tilted -->
    <g transform="rotate(-35)">
      <rect x="-42" y="-105" width="84" height="210" rx="42" fill="#F8FAFC" />
      <path d="M-42,0 L42,0 L42,63 A42,42 0 0,1 -42,63 Z" fill="url(#medGrad)" />
      <!-- Shine -->
      <path d="M -22,-85 A 22,22 0 0,1 -22,-30" stroke="rgba(255,255,255,0.7)" stroke-width="6" stroke-linecap="round" fill="none" />
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#CBD5E1" stroke-width="3" />
    </g>
    <!-- Plus symbol in center -->
    <rect x="-10" y="-80" width="20" height="40" rx="4" fill="#38BDF8" />
    <rect x="-20" y="-70" width="40" height="20" rx="4" fill="#38BDF8" />
  </g>
</svg>
